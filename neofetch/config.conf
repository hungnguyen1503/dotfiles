# neofetch generates this file on first run; it lives in the dotfiles repo
# because ~/.config/neofetch is symlinked here. Empty print_info means the
# built-in default output is used.
print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info "Colors" cols1 cols2

    print_line_break
}
